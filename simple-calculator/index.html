<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="container">
      <div class="result-field">
        <input type="text" id="result">
      </div>
      <div class="btn-row">
        <button onclick="calc('1')">1</button>
        <button onclick="calc('2')">2</button>
        <button onclick="calc('3')">3</button>
        <button onclick="calc('+')">+</button>
        <button onclick="calc('-')">-</button>
      </div>
      <div class="btn-row">
        <button onclick="calc('4')">4</button>
        <button onclick="calc('5')">5</button>
        <button onclick="calc('6')">6</button>
        <button onclick="calc('*')">*</button>
        <button onclick="calc('/')">/</button>
      </div>
      <div class="btn-row">
        <button onclick="calc('7')">7</button>
        <button onclick="calc('8')">8</button>
        <button onclick="calc('9')">9</button>
        <button onclick="calc('0')">0</button>
        <button onclick="solve('=')">=</button>
      </div>
      <div class="btn-row clear">
        <button class="clear" onclick="clr()">clear</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>

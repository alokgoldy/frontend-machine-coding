<!doctype html>
<html lang="en">

<head>
  <title>Inline flex</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <h1>inline-flex (Shrinks to fit content)</h1>
  <div class="container">
    <div class="inline-flex-c">
      <div class="child">child 1</div>
      <div class="child">child 2</div>
    </div>
  </div>

  <h1>flex (Takes up 100% width)</h1>
  <div class="container">
    <div class="flex-c">
      <div class="child">child 1</div>
      <div class="child">child 2</div>
    </div>
  </div>
</body>

</html>

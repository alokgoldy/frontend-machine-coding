<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senior Level Star Rating</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="rating-container">
      <h1>Rate your experience</h1>
      <div
        class="stars"
        role="radiogroup"
        aria-label="Rating"
      >
        <!-- Stars will be generated by JS or can be static but let's make it dynamic for better control -->
      </div>
      <p class="rating-text">Select a rating</p>
      <input
        type="hidden"
        name="rating"
        id="rating-value"
      >
    </div>

    <script src="script.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            display:  flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .fire {
            animation: burn 1s ease-out;
            color: #d32f2f;
            font-weight: bold;
        }

        @keyframes burn {
            0% {
                box-shadow: 0 0 5px #ff4500;
                background-color: #fff5f5;
            }

            20% {
                box-shadow: 0 0 15px #ff4500, 0 0 25px #ff8c00;
                background-color: #ffe0e0;
                transform: scale(1.02);
            }

            50% {
                box-shadow: 0 0 25px #ff0000, 0 0 35px #ff4500, 0 0 45px #ff8c00;
                background-color: #ffcccc;
                transform: scale(1.05);
            }

            80% {
                box-shadow: 0 0 15px #ff4500;
                background-color: #ffe0e0;
                transform: scale(1.02);
            }

            100% {
                box-shadow: none;
                background-color: white;
                transform: scale(1);
            }
        }
    </style>
</head>

<body>
    <table id="calcu">
        <tr>
            <td colspan="3">
                <input type="text" id="result">
            </td>
            <td>
                <input type="button" value="c" onclick="clr()" />
            </td>
        </tr>

        <tr>
            <td>
                <input type="button" value="1" onClick="dis('1')" onkeydown="myFunction(event)">
            </td>
            <td>
                <input type="button" value="2" onClick="dis('2')" onkeydown="myFunction(event)">
            </td>
            <td>
                <input type="button" value="3" onClick="dis('3')" onkeydown="myFunction(event)">
            </td>
            <td>
                <input type="button" value="/" onClick="dis('/')" onkeydown="myFunction(event)">
            </td>
        </tr>

        <tr>
            <td>
                <input type="button" value="4" onClick="dis('4')" onkeydown="myFunction(event)">
            </td>
            <td>
                <input type="button" value="5" onClick="dis('5')" onkeydown="myFunction(event)">
            </td>
            <td>
                <input type="button" value="6" onClick="dis('6')" onkeydown="myFunction(event)">
            </td>
            <td>
                <input type="button" value="*" onClick="dis('*')" onkeydown="myFunction(event)">
            </td>
        </tr>

        <tr>
            <td>
                <input type="button" value="7" onClick="dis('7')" onkeydown="myFunction(event)">
            </td>
            <td>
                <input type="button" value="8" onClick="dis('8')" onkeydown="myFunction(event)">
            </td>
            <td>
                <input type="button" value="9" onClick="dis('9')" onkeydown="myFunction(event)">
            </td>
            <td>
                <input type="button" value="-" onClick="dis('-')" onkeydown="myFunction(event)">
            </td>
        </tr>

        <tr>
            <td>
                <input type="button" value="0" onClick="dis('0')" onkeydown="myFunction(event)">
            </td>
            <td>
                <input type="button" value="." onClick="dis('.')" onkeydown="myFunction(event)">
            </td>
            <td>
                <input type="button" value="=" onClick="solve()">
            </td>
            <td>
                <input type="button" value="+" onClick="dis('+')" onkeydown="myFunction(event)">
            </td>
        </tr>
    </table>
    <script>

        function dis(val) {
            console.log('alok99val', val);
            document.getElementById("result").value += val;
        }

        function myFunction(event) {
            console.log('alok99', event);
            if (event.key == '0' || event.key == '1' || event.key == '2' || event.key == '3'
                || event.key == '4' || event.key == '5' || event.key == '6' || event.key == '7'
                || event.key == '8' || event.key == '9' || event.key == '+' || event.key == '-'
                || event.key == '*' || event.key == '/') {
                document.getElementById("result").value += event.key;
            }
        }

        function solve() {
            let x = document.getElementById("result").value;
            try {
                let y = Function(`"use strict"; return (${x})`)();
                y = eval(x);
                y = calculate(x);
                y = calculate2(x);
                const resultInput = document.getElementById("result");
                resultInput.value = y;

                // Add fire effect
                resultInput.classList.add("fire");
                setTimeout(() => {
                    resultInput.classList.remove("fire");
                }, 1000);
            } catch (err) {
                // alert
                alert("Invalid expression");
            }
        }

        function calculate(expression) {
            const tokens = expression.match(/\d+|\+|\-|\*|\//g);
            if (!tokens) return 0;

            // Handle * and /
            let stack = [];
            let current = Number(tokens[0]);

            for (let i = 1; i < tokens.length; i += 2) {
                const operator = tokens[i];
                const next = Number(tokens[i + 1]);

                if (operator === "*") current *= next;
                else if (operator === "/") current /= next;
                else {
                    stack.push(current);
                    stack.push(operator);
                    current = next;
                }
            }

            stack.push(current);

            // Handle + and -
            let result = stack[0];
            for (let i = 1; i < stack.length; i += 2) {
                if (stack[i] === "+") result += stack[i + 1];
                else result -= stack[i + 1];
            }

            return result;
        }

        function calculate2(exp) {
            let num = '';
            const st = [];

            for (let i = 0; i < exp.length; i++) {
                const ch = exp[i];
                if (ch >= '0' && ch <= '9') {
                    num += ch;
                } else if (ch == '*' || ch == '/' || ch == '+' || ch == '-') {
                    st.push(Number(num));
                    num = '';
                    st.push(ch);
                }
            }

            if (num !== '') {
                st.push(Number(num));
                num = '';
            }
            if (st.length === 0) return 0;

            const temp = [];
            let i = 0;

            while (i < st.length) {
                if (st[i] == '*' || st[i] == '/') {
                    const prev = temp.pop();
                    const next = st[i + 1];

                    const result = st[i] == '*' ?
                        prev * next
                        : Math.trunc(prev / next);

                    temp.push(result);
                    i += 2;
                } else {
                    temp.push(st[i]);
                    i++;
                }
            }

            let result = temp[0];

            console.log(result, 'result')
            for (let i = 1; i < temp.length; i += 2) {
                const op = temp[i];
                const num = temp[i + 1];

                if (op === '+') result += num;
                else result -= num;
            }
            return result;
        }
        function clr() {
            document.getElementById("result").value = "";
            document.getElementById("result").value = y;
        }
    </script>
</body>

</html>

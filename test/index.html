<head>

  <title>
    gfg star rating

</head>

<body>
  <div class="card">
    <h2>GFG Star Rating</h2>

      <span onclick="gfg(2)" class="star">*</span>

    <div id="scoreElement">Score- 0/5</div>
  </div>
  <script src="script.js"></script>
</body>

</html>
